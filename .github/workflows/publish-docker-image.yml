name: Build & Push Docker image

on:
  push:
    paths-ignore:
      - "README.md"
    branches:
      - "main"
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-1
  AWS_ROLE_ARN: arn:aws:iam::362072154386:role/github-oidc-simple-proxy-rotator-ecr-push
  REGISTRY: 362072154386.dkr.ecr.eu-west-1.amazonaws.com
  PROJECT: simple-proxy-rotator
  VERSION: stable

jobs:
  build-stable:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout to branch
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push the container to Amazon ECR
        uses: docker/build-push-action@v5.3.0
        with:
          context: .
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.PROJECT }}:${{ env.VERSION }}
          push: true
          provenance: false
